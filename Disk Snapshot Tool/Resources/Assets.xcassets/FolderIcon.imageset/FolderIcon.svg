<!--
    Sidebar icon for a plain folder of disk images.

    Drawn for this project on the 16 pt grid the sidebar renders it at. It stands
    in for NSWorkspace's real Finder icon so that a folder row and a UTM bundle
    row share one silhouette — see UTMBundleIcon.svg, which is this same folder
    with "UTM" written on it.
-->
