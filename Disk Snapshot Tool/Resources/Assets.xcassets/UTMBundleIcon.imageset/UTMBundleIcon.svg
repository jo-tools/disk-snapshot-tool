<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Sidebar icon for a UTM virtual machine bundle.

    FolderIcon.svg with "UTM" written on its face, so a VM bundle reads as the
    same kind of container as a folder and differs only in what it holds. The
    letters are outlined paths rather than text, so the rendering does not depend
    on a font being available to the asset compiler.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path fill="#2E8BD6" d="M 2.4 2.6 H 6.1 C 6.55 2.6 6.97 2.82 7.22 3.19 L 7.95 4.25 H 13.6 C 14.37 4.25 15 4.88 15 5.65 V 12.0 C 15 12.77 14.37 13.4 13.6 13.4 H 2.4 C 1.63 13.4 1 12.77 1 12.0 V 4.0 C 1 3.23 1.63 2.6 2.4 2.6 Z"/>
  <path fill="#5AAFEE" d="M 1 6.1 H 15 V 12.0 C 15 12.77 14.37 13.4 13.6 13.4 H 2.4 C 1.63 13.4 1 12.77 1 12.0 Z"/>
  <g fill="#ffffff">
    <path d="M 1.6 7.3 H 2.8 V 10.6 A 0.5 0.5 0 0 0 3.3 11.1 H 3.7 A 0.5 0.5 0 0 0 4.2 10.6 V 7.3 H 5.4 V 10.8 A 1.5 1.5 0 0 1 3.9 12.3 H 3.1 A 1.5 1.5 0 0 1 1.6 10.8 Z"/>
    <path d="M 5.9 7.3 H 9.5 V 8.5 H 8.3 V 12.3 H 7.1 V 8.5 H 5.9 Z"/>
    <path d="M 10.0 12.3 V 7.3 H 11.2 L 12.2 9.3 L 13.2 7.3 H 14.4 V 12.3 H 13.3 V 9.4 L 12.5 10.9 H 11.9 L 11.1 9.4 V 12.3 Z"/>
  </g>
</svg>
